name: pnu-project-management-system

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pms}
      POSTGRES_USER: ${POSTGRES_USER:-pms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pms_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pms}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pms_local_password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pms}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pms_local_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-pms-local}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        && (mc ilm rule ls "local/$${MINIO_BUCKET}" >/dev/null 2>&1
        || mc ilm rule add --prefix "staging/" --expire-days 1 "local/$${MINIO_BUCKET}")
    restart: "no"

volumes:
  postgres_data:
  minio_data:
