      <title id="role-access-matrix-title">AIPMS 역할별 권한</title>
      <desc id="role-access-matrix-desc">학생, 교수, 관리자, 자문위원 네 역할이 프로그램 개설부터 투표와 관리 이력까지 아홉 가지 기능에 대해 각각 어디까지 할 수 있는지 보여주는 표. 자문위원은 초대 토큰으로 들어와 배정된 팀의 채점과 피드백만 다룰 수 있고, 관리자와 자문위원의 투표 한도만 기본 다섯 표로 따로 계산된다.</desc>
