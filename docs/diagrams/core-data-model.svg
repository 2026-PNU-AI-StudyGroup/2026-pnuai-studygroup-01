      <title id="core-data-model-title">AIPMS 핵심 데이터 모델</title>
      <desc id="core-data-model-desc">프로그램이 여러 프로젝트를 담고, 프로젝트마다 확정 팀이 최대 하나 붙으며, 그 팀에 구성원과 보고서와 첨부 파일이 매달린다. 투표는 프로그램, 프로젝트, 투표자 조합에 유일 제약을 걸어 한 사람이 같은 프로젝트에 두 번 투표하지 못하게 막는다. 저장소의 65개 모델 가운데 뼈대에 해당하는 8개만 추렸다.</desc>
