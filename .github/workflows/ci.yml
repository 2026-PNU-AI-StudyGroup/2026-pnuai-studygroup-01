name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_URL: https://pms.example.test
      BETTER_AUTH_SECRET: ci_only_random_secret_4a2fdd936e1c4973b5b2e5a8197e742c
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      DATABASE_URL: postgresql://pms:pms@127.0.0.1:5432/pms
      MINIO_BUCKET: pms-ci
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: pms
      S3_SECRET_KEY: pms-ci-secret
      S3_FORCE_PATH_STYLE: "true"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3.5:2b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run build
