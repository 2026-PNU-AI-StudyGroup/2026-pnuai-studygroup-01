name: pnu-project-management-system-production

services:
  postgres:
    image: postgres:18.4-alpine3.24
    env_file: ${ENV_FILE:-.env.production}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    env_file: ${ENV_FILE:-.env.production}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        && (mc ilm rule ls "local/$${MINIO_BUCKET}" >/dev/null 2>&1
        || mc ilm rule add --prefix "staging/" --expire-days 1 "local/$${MINIO_BUCKET}")
    restart: "no"

  migrate:
    build:
      context: .
      target: migrator
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # 운영 이미지(runner)는 Next standalone 이라 scripts 도 tsx 도 없다.
  # 스크립트 실행에 필요한 도구가 모두 들어 있는 시드용 스테이지를 그대로 쓴다.
  # 실행: docker compose -f compose.production.yaml --env-file .env.production run --rm import-opus
  import-opus:
    build:
      context: .
      target: demo-seeder
    env_file: ${ENV_FILE:-.env.production}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["./node_modules/.bin/tsx", "scripts/import-opus-archive.ts", "--confirm"]
    restart: "no"

  app:
    build:
      context: .
      target: runner
    env_file: ${ENV_FILE:-.env.production}
    environment:
      # 구글 토큰 주소는 IPv6 도 함께 내려주는데 이 서버에는 IPv6 경로가 없다.
      # 그쪽으로 붙다 시간만 버리고 죽으므로 IPv4 를 먼저 쓴다.
      NODE_OPTIONS: --dns-result-order=ipv4first
    # 도커 기본값은 호스트의 systemd-resolved 스텁(127.0.0.53)으로 넘긴다. 한 단계를
    # 더 거치면서 이름 조회가 간헐적으로 실패했고(EAI_AGAIN), 그때마다 구글 토큰 교환이
    # 깨져 로그인이 한 번에 되지 않았다. 상위 DNS 를 직접 물려 그 단계를 없앤다.
    dns:
      - ${DNS_PRIMARY:-164.125.9.2}
      - ${DNS_SECONDARY:-164.125.5.53}
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
